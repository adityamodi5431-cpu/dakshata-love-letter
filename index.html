<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Dakshata ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <div class="container">

        <h1 class="heading">Khuchu phuchu ke liye ek letter</h1>

        <p class="subtitle">pyaari babu ke liye pyaara sa letter</p>

        <div class="envelope" id="envelope">
            <div class="back"></div>
            <div class="letter">
                <span>For My Love ❤️</span>
            </div>
            <div class="flap"></div>
            <div class="front"></div>
            <div class="heart">❤️</div>
        </div>

        <button id="openBtn">Open💌</button>

        <div class="letter-content" id="letterContent">
            <h2>Meri pyaari golu babu ❤️</h2>
            <p id="message"></p>
            <h3 id="ending"></h3>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
